name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish-openapi:
    name: Publish OpenAPI contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Generate openapi/openapi.json
        run: npm run openapi:generate

      - name: Publish as GitHub Release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view openapi-latest >/dev/null 2>&1; then
            gh release delete openapi-latest --yes --cleanup-tag
          fi

          gh release create openapi-latest openapi/openapi.json \
            --title "OpenAPI contract (auto-generated)" \
            --notes "Gerado a partir do commit ${{ github.sha }}. Consumido pelo web-notes via \`npm run api:sync\`. Não é uma release de código — é só o artefato do contrato HTTP."

  build:
    name: Build and publish ARM64
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/4jc4/api-notes:${{ github.sha }}
            ghcr.io/4jc4/api-notes:latest

  deploy:
    name: Deploy production
    needs: build
    runs-on: self-hosted
    timeout-minutes: 15

    permissions:
      contents: read
      packages: read

    environment:
      name: production
      url: https://notas.ajca.com.br/api/health

    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v4

      - name: Update Compose on API host
        run: |
          scp docker-compose.yml \
            deploy@192.168.1.31:/opt/app/docker-compose.yml

      - name: Login API host to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_TOKEN" | \
            ssh deploy@192.168.1.31 \
            "docker login ghcr.io -u '$GHCR_USER' --password-stdin"

      - name: Deploy image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ssh deploy@192.168.1.31 "
            set -e

            cd /opt/app

            IMAGE_TAG='$IMAGE_TAG' docker compose pull api

            IMAGE_TAG='$IMAGE_TAG' \
              docker compose run --rm api \
              npx prisma migrate deploy

            IMAGE_TAG='$IMAGE_TAG' \
              docker compose up -d api
          "

      - name: Healthcheck
        run: |
          for i in $(seq 1 12); do
            if ssh deploy@192.168.1.31 \
              "curl -fsS http://127.0.0.1:3000/health | grep -q '\"status\":\"ok\"'"; then
              echo "Deploy saudável"
              exit 0
            fi

            echo "Aguardando API... ($i/12)"
            sleep 5
          done

          echo "API não ficou saudável"
          exit 1
