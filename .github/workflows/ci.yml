name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: notes_test
          POSTGRES_PASSWORD: notes_test
          POSTGRES_DB: notes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U notes_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://notes_test:notes_test@localhost:5432/notes_test
      SESSION_SECRET: ci-test-secret-not-for-production-use-only-32chars
      SESSION_TTL: 7d
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Apply migrations to test database
        run: npx prisma migrate deploy

      - name: Run unit tests
        run: npm run test

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Build Docker image
        run: docker build -t api-notes:ci-check .

      # Só buildar não bastava: a imagem já builda com sucesso mesmo
      # quando o entrypoint (dist/src/main.js) não existe de verdade —
      # só um crash em runtime revela isso. Roda a imagem de verdade
      # contra o Postgres real deste job e bate no /health.
      - name: Validate Docker image actually boots
        run: |
          docker run -d --name api-notes-ci-check \
            --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e SESSION_SECRET="$SESSION_SECRET" \
            -e SESSION_TTL="$SESSION_TTL" \
            -e NODE_ENV=production \
            -e PORT=3000 \
            api-notes:ci-check

          for i in $(seq 1 15); do
            if curl -fsS http://localhost:3000/health | grep -q '"status":"ok"'; then
              echo "Imagem sobe e responde /health"
              exit 0
            fi
            echo "Aguardando container... ($i/15)"
            sleep 2
          done

          echo "::error::Imagem não respondeu /health a tempo"
          docker logs api-notes-ci-check
          exit 1

      - name: Docker container logs (always, for debugging)
        if: always()
        run: docker logs api-notes-ci-check 2>&1 || true

  lint-pr-title:
    name: Lint PR Title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read

    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
