name: Ops - API host disk cleanup

# Ferramenta temporária de diagnóstico/limpeza pontual pro problema de
# "no space left on device" no host da API (192.168.1.31) que estava
# quebrando o job "Deploy production" de release.yml. Roda no mesmo
# runner self-hosted que já tem acesso SSH a esse host pros deploys
# normais — não é um novo canal de acesso, só reaproveita o existente.
# Remover este arquivo depois de resolvido.

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'diagnose (só mostra o que está ocupando espaço) ou clean (docker builder prune -f + docker image prune -f, nunca mexe em imagens/containers em uso)'
        required: true
        default: 'diagnose'
        type: choice
        options:
          - diagnose
          - clean

permissions:
  contents: read

jobs:
  run:
    name: ${{ inputs.action }}
    runs-on: self-hosted
    timeout-minutes: 10

    steps:
      - name: Diagnose
        if: inputs.action == 'diagnose'
        run: |
          ssh deploy@192.168.1.31 "
            echo '=== df -h ==='
            df -h /
            echo
            echo '=== docker system df ==='
            docker system df -v
            echo
            echo '=== docker ps -a ==='
            docker ps -a
          "

      - name: Clean (builder cache + dangling images only)
        if: inputs.action == 'clean'
        run: |
          ssh deploy@192.168.1.31 "
            set -e
            echo '=== antes ==='
            df -h /
            docker builder prune -f
            docker image prune -f
            echo '=== depois ==='
            df -h /
          "
