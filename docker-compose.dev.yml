services:
  db:
    image: postgres:17-alpine
    container_name: notes-db-local
    restart: unless-stopped
    environment:
      POSTGRES_USER: notes_user
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: notes
    ports:
      - '5432:5432'
    volumes:
      - notes-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U notes_user']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  notes-db-data:
